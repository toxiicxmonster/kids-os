# Kids OS: touch panels that need a fix (installed to /etc/tablet-os/touch-panels.conf
# once; your edits there are kept. Re-run `sudo ./install.sh 40` after editing.)
#
#   <vendor>:<product>  <fixes...>
#
#   as-touch   the kernel reports the panel as a pen ("Stylus") with no axis
#              resolution, so libinput ignores it and taps never arrive:
#              classify it as a touchscreen.
#   debounce   it reports the finger lifted for a few ms mid-drag, so drags
#              turn into taps: tablet-touch-debounce re-emits it cleanly.
#
# Find a panel's ids with `libinput list-devices` (Id: usb:VVVV:PPPP) or
# `grep -A4 -i touch /proc/bus/input/devices`. Most panels need neither fix.

1ddb:0001  as-touch debounce   # "HID TOUCH HID Touch Panel" (built with this one)
