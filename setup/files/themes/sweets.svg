<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Kids OS theme "Sweets": candy-pink sky, cotton-candy clouds, lollipops and cupcakes. Middle kept clear. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="0.6" stop-color="#ffe6f2"/>
      <stop offset="1" stop-color="#fff4e0"/>
    </linearGradient>
    <g id="cloud">
      <path d="M40 0 Q-10 0 10 -45 Q20 -95 85 -85 Q100 -150 175 -140 Q215 -185 275 -150 Q345 -165 350 -95 Q410 -85 395 -35 Q395 0 345 0 Z" fill="#c9e8ff" stroke="#a0cff2" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g id="lolly">
      <path d="M0 0 L0 230" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 0 L0 230" stroke="#e8d8c0" stroke-width="3"/>
      <circle r="90" fill="#ff8fb1" stroke="#e0607f" stroke-width="9"/>
      <path d="M0 0 Q30 -40 0 -60 Q-50 -40 -40 10 Q-20 70 40 60 Q90 30 75 -30" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g id="cupcake" stroke-width="8" stroke-linejoin="round">
      <path d="M-70 0 L-55 -100 L55 -100 L70 0 Z" fill="#c98a5a" stroke="#a0683a"/>
      <path d="M-40 0 L-32 -100 M0 0 L0 -100 M40 0 L32 -100" stroke="#a0683a" stroke-width="5"/>
      <path d="M-80 -100 Q-90 -150 -40 -160 Q-30 -210 20 -200 Q70 -200 70 -160 Q100 -140 80 -100 Z" stroke="#e0607f"/>
      <circle cx="0" cy="-215" r="18" fill="#ff4d6d" stroke="#d9304d"/>
      <g stroke="none">
        <rect x="-40" y="-150" width="18" height="7" rx="3" fill="#7fc8ff" transform="rotate(30 -31 -146)"/>
        <rect x="10" y="-170" width="18" height="7" rx="3" fill="#ffe14d" transform="rotate(-25 19 -166)"/>
        <rect x="30" y="-125" width="18" height="7" rx="3" fill="#8fdc7a" transform="rotate(15 39 -121)"/>
      </g>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- cotton-candy clouds -->
  <use href="#cloud" transform="translate(90 250) scale(0.85)"/>
  <use href="#cloud" transform="translate(1250 200) scale(0.7)"/>
  <use href="#cloud" transform="translate(700 140) scale(0.5)"/>

  <!-- frosting hill -->
  <path d="M0 970 Q160 930 320 970 Q480 1010 640 970 Q800 930 960 970 Q1120 1010 1280 970 Q1440 930 1600 970 Q1760 1010 1920 970 L1920 1080 L0 1080 Z" fill="#fff0f6" stroke="#ffc2dc" stroke-width="8"/>

  <!-- lollipops and cupcakes around the edges -->
  <use href="#lolly" transform="translate(150 700)"/>
  <use href="#lolly" transform="translate(1790 650) scale(0.9)"/>
  <use href="#cupcake" transform="translate(420 1010)" fill="#ffc2dc"/>
  <use href="#cupcake" transform="translate(1520 1020) scale(0.9)" fill="#c9e8ff"/>
  <use href="#cupcake" transform="translate(980 1030) scale(0.6)" fill="#fff3a0"/>

  <!-- sprinkles -->
  <g stroke-width="10" stroke-linecap="round">
    <path d="M500 220 L520 240" stroke="#7fc8ff"/><path d="M1680 260 L1700 240" stroke="#ff8fb1"/>
    <path d="M1060 90 L1080 110" stroke="#8fdc7a"/><path d="M300 520 L320 500" stroke="#ffe14d"/>
    <path d="M1620 460 L1640 480" stroke="#c9a0ff"/><path d="M880 1050 L900 1030" stroke="#ff8fb1"/>
  </g>
</svg>
