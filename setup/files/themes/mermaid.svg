<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Kids OS theme "Mermaid lagoon": turquoise-to-purple water, a mermaid tail, shells, pearls, bubbles. Middle kept clear. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe3e8"/>
      <stop offset="0.55" stop-color="#8fb8f0"/>
      <stop offset="1" stop-color="#b58fe8"/>
    </linearGradient>
    <g id="bubble">
      <circle r="18" fill="#ffffff" fill-opacity="0.3" stroke="#f0faff" stroke-width="5"/>
      <circle cx="-6" cy="-6" r="4" fill="#ffffff"/>
    </g>
    <g id="shell">
      <path d="M0 0 Q-70 -10 -60 -70 Q-40 -120 0 -125 Q40 -120 60 -70 Q70 -10 0 0 Z" stroke-width="7" stroke-linejoin="round"/>
      <path d="M0 -5 L0 -115 M0 -5 L-35 -105 M0 -5 L35 -105 M0 -5 L-55 -70 M0 -5 L55 -70" fill="none" stroke-width="5"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- shimmer -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35">
    <path d="M120 120 Q200 90 280 120"/><path d="M700 80 Q780 50 860 80"/><path d="M1300 140 Q1380 110 1460 140"/>
  </g>

  <!-- sand with shells and pearls -->
  <path d="M0 985 Q320 945 640 980 Q960 1015 1280 975 Q1600 940 1920 975 L1920 1080 L0 1080 Z" fill="#ffe3c2" stroke="#f0c08f" stroke-width="8"/>
  <use href="#shell" transform="translate(560 1040) scale(0.8)" fill="#ffc2dc" stroke="#e08ab0"/>
  <use href="#shell" transform="translate(1180 1030) scale(0.65) rotate(-12)" fill="#ffe08a" stroke="#e5b23a"/>
  <g fill="#ffffff" stroke="#e0d0f0" stroke-width="4">
    <circle cx="700" cy="1035" r="14"/><circle cx="730" cy="1040" r="11"/><circle cx="1290" cy="1030" r="13"/>
  </g>

  <!-- seaweed -->
  <g fill="none" stroke="#5fd1a0" stroke-width="22" stroke-linecap="round">
    <path d="M90 990 Q50 900 100 820 Q150 740 100 660"/>
    <path d="M1830 985 Q1870 900 1820 820 Q1770 740 1820 660"/>
  </g>

  <!-- a mermaid tail splashing, bottom right -->
  <g transform="translate(1560 860) rotate(-20)" stroke="#2a8f8f" stroke-width="9" stroke-linejoin="round">
    <path d="M-40 120 Q-70 0 -30 -120 L30 -120 Q70 0 40 120 Z" fill="#45c9b8"/>
    <path d="M-30 -120 Q-130 -200 -150 -150 Q-110 -120 -20 -110 Z" fill="#c9a0ff" stroke="#8f6fd0"/>
    <path d="M30 -120 Q130 -200 150 -150 Q110 -120 20 -110 Z" fill="#c9a0ff" stroke="#8f6fd0"/>
    <g fill="none" stroke="#2a8f8f" stroke-width="5" opacity="0.6">
      <path d="M-35 60 Q0 80 35 60"/><path d="M-35 20 Q0 40 35 20"/><path d="M-32 -20 Q0 0 32 -20"/><path d="M-30 -60 Q0 -40 30 -60"/>
    </g>
  </g>

  <!-- starfish and bubbles -->
  <path transform="translate(260 1010)" d="M0 -40 L11 -12 L40 -12 L17 6 L26 34 L0 17 L-26 34 L-17 6 L-40 -12 L-11 -12 Z" fill="#ff8fb1" stroke="#e0607f" stroke-width="6" stroke-linejoin="round"/>
  <use href="#bubble" transform="translate(300 200) scale(1.2)"/>
  <use href="#bubble" transform="translate(340 130) scale(0.7)"/>
  <use href="#bubble" transform="translate(1600 240)"/>
  <use href="#bubble" transform="translate(1640 170) scale(0.6)"/>
  <use href="#bubble" transform="translate(200 640) scale(0.9)"/>
  <use href="#bubble" transform="translate(1440 620) scale(0.8)"/>
  <use href="#bubble" transform="translate(980 90) scale(0.7)"/>
</svg>
