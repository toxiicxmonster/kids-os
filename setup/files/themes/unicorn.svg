<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Kids OS theme "Unicorn": pastel sky, rainbow clouds, stars and a unicorn. Middle kept clear. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b6ff"/>
      <stop offset="0.55" stop-color="#e7d4ff"/>
      <stop offset="1" stop-color="#ffe0f0"/>
    </linearGradient>
    <g id="cloud">
      <path d="M40 0 Q-10 0 10 -45 Q20 -95 85 -85 Q100 -150 175 -140 Q215 -185 275 -150 Q345 -165 350 -95 Q410 -85 395 -35 Q395 0 345 0 Z" fill="#ffffff" stroke="#f0c8ef" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g id="star">
      <path d="M0 -30 L9 -9 L30 -9 L13 5 L19 27 L0 14 L-19 27 L-13 5 L-30 -9 L-9 -9 Z" fill="#fff3a0" stroke="#f2c94c" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- rainbow between two clouds, top right -->
  <g fill="none" stroke-width="30" transform="translate(1520 420)">
    <path d="M-300 0 A300 300 0 0 1 300 0" stroke="#ff8fb1"/>
    <path d="M-270 0 A270 270 0 0 1 270 0" stroke="#ffc58f"/>
    <path d="M-240 0 A240 240 0 0 1 240 0" stroke="#fff08f"/>
    <path d="M-210 0 A210 210 0 0 1 210 0" stroke="#a8f0b0"/>
    <path d="M-180 0 A180 180 0 0 1 180 0" stroke="#9fd3ff"/>
    <path d="M-150 0 A150 150 0 0 1 150 0" stroke="#c9a8ff"/>
  </g>
  <use href="#cloud" transform="translate(1110 470) scale(0.7)"/>
  <use href="#cloud" transform="translate(1700 470) scale(0.7)"/>

  <!-- clouds along the bottom -->
  <use href="#cloud" transform="translate(-80 1060) scale(1.3)"/>
  <use href="#cloud" transform="translate(760 1080) scale(1.1)"/>

  <!-- stars -->
  <use href="#star" transform="translate(200 160)"/>
  <use href="#star" transform="translate(560 90) scale(0.7)"/>
  <use href="#star" transform="translate(900 180) scale(0.9)"/>
  <use href="#star" transform="translate(120 560) scale(0.8)"/>
  <use href="#star" transform="translate(1860 700) scale(0.7)"/>

  <!-- unicorn, bottom right -->
  <g transform="translate(1500 930)" stroke="#c9a0d9" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-150 -40 Q-260 -60 -250 40 Q-210 -10 -170 10 Z" fill="#ff9fc8"/>
    <g fill="#ffffff">
      <rect x="-148" y="-20" width="36" height="85" rx="14"/><rect x="-78" y="-20" width="36" height="85" rx="14"/>
      <rect x="2" y="-20" width="36" height="85" rx="14"/><rect x="62" y="-20" width="36" height="85" rx="14"/>
    </g>
    <path d="M-170 0 Q-180 -150 -20 -150 Q110 -150 120 -40 Q125 0 80 0 Z" fill="#ffffff"/>
    <path d="M70 -120 Q80 -250 170 -255 Q250 -255 250 -190 Q250 -140 180 -140 Q130 -140 120 -60 Z" fill="#ffffff"/>
    <path d="M190 -255 L215 -345 L225 -250 Z" fill="#ffd66b" stroke="#e5b23a"/>
    <path d="M100 -230 Q60 -230 60 -170 Q40 -130 70 -100 Q90 -150 130 -160 Q110 -200 150 -245 Z" fill="#c9a0ff"/>
    <path d="M120 -250 Q150 -280 175 -255" fill="#ff9fc8"/>
    <circle cx="205" cy="-205" r="12" fill="#1d2733" stroke="none"/>
    <circle cx="201" cy="-209" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="225" cy="-170" r="14" fill="#ffc2dc" stroke="none"/>
  </g>
</svg>
