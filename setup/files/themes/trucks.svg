<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Kids OS theme "Trucks": a construction site with a digger, a dump truck and cones. Middle kept clear. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8f2"/>
      <stop offset="0.65" stop-color="#bfe6fa"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
    <g id="wheel">
      <circle r="52" fill="#3a3f4a" stroke="#22262e" stroke-width="8"/>
      <circle r="22" fill="#c9ced8" stroke="#22262e" stroke-width="6"/>
    </g>
    <g id="cone">
      <path d="M-40 0 L-14 -110 L14 -110 L40 0 Z" fill="#ff8a2a" stroke="#d9661a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-30 -40 L30 -40 L25 -62 L-25 -62 Z" fill="#ffffff"/>
      <rect x="-50" y="-8" width="100" height="16" rx="6" fill="#d9661a"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- sun and a cloud -->
  <circle cx="1720" cy="160" r="85" fill="#ffe14d" stroke="#ffbf1f" stroke-width="10"/>
  <path d="M180 220 Q150 220 160 190 Q170 150 220 160 Q240 110 300 125 Q350 100 380 150 Q430 150 420 195 Q420 220 380 220 Z" fill="#ffffff" stroke="#9fd3f2" stroke-width="8"/>

  <!-- crane, top left -->
  <g stroke="#e5a52a" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M120 940 L120 330 M180 940 L180 330 M120 330 L180 330"/>
    <path d="M120 900 L180 840 M120 780 L180 720 M120 660 L180 600 M120 540 L180 480 M120 420 L180 360"/>
    <path d="M60 330 L760 330 M150 330 L150 270 L60 330 M150 270 L620 330"/>
  </g>
  <path d="M600 330 L600 470" stroke="#3a3f4a" stroke-width="6"/>
  <rect x="560" y="470" width="80" height="60" rx="8" fill="#ff6b6b" stroke="#d94a4a" stroke-width="6"/>

  <!-- ground -->
  <path d="M0 950 Q480 920 960 945 Q1440 970 1920 935 L1920 1080 L0 1080 Z" fill="#c9965c" stroke="#a87840" stroke-width="8"/>
  <path d="M520 950 Q600 870 700 950 Z" fill="#a87840"/>

  <!-- dump truck, bottom right -->
  <g transform="translate(1440 900)">
    <path d="M-250 -40 L-230 -200 L60 -200 L90 -40 Z" fill="#ffcf3f" stroke="#d9a520" stroke-width="10" stroke-linejoin="round"/>
    <rect x="-260" y="-60" width="510" height="60" rx="12" fill="#ffb21f" stroke="#d9a520" stroke-width="10"/>
    <path d="M100 -60 L100 -190 L200 -190 L250 -110 L250 -60 Z" fill="#ffcf3f" stroke="#d9a520" stroke-width="10" stroke-linejoin="round"/>
    <path d="M125 -170 L190 -170 L225 -115 L125 -115 Z" fill="#9fe0ff" stroke="#3a7fc0" stroke-width="6"/>
    <use href="#wheel" transform="translate(-170 10)"/>
    <use href="#wheel" transform="translate(-40 10)"/>
    <use href="#wheel" transform="translate(170 10)"/>
  </g>

  <!-- cones -->
  <use href="#cone" transform="translate(860 990)"/>
  <use href="#cone" transform="translate(1010 1000) scale(0.8)"/>
  <use href="#cone" transform="translate(330 985) scale(0.9)"/>
</svg>
